name: Django and frontend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: python manage.py check
      - name: Run migrations
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: python manage.py migrate --noinput
      - name: Seed sample data
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: python manage.py seed_data
      - name: Run Django tests
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: python manage.py test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm install
      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
      - name: Generate real API and terminal evidence
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        shell: bash
        run: |
          set -euo pipefail
          python manage.py runserver 127.0.0.1:8000 > ../django_server 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/djangoapp/api/dealers/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/djangoapp/api/dealers/ >/dev/null
          printf "%s\\n" "$ curl -i -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/login/ -H 'Content-Type: application/json' -d '{\\"username\\":\\"demo\\",\\"password\\":\\"DemoPass123!\\"}'" > ../loginuser
          curl -i -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/login/ -H 'Content-Type: application/json' -d '{"username":"demo","password":"DemoPass123!"}' >> ../loginuser 2>&1
          printf "%s\\n" "$ curl -i -b cookies.txt -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/logout/ -H 'Content-Type: application/json' -d '{}'" > ../logoutuser
          curl -i -b cookies.txt -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/logout/ -H 'Content-Type: application/json' -d '{}' >> ../logoutuser 2>&1
          printf '$ curl -sS http://127.0.0.1:8000/djangoapp/api/dealers/\n' > ../getalldealers
          curl -sS http://127.0.0.1:8000/djangoapp/api/dealers/ >> ../getalldealers 2>&1
          printf '\n\n$ curl -sS http://127.0.0.1:8000/djangoapp/api/dealers/1/reviews/\n' >> ../getdealerreviews
          curl -sS http://127.0.0.1:8000/djangoapp/api/dealers/1/reviews/ >> ../getdealerreviews 2>&1
          printf '$ curl -sS http://127.0.0.1:8000/djangoapp/api/dealers/1/\n' > ../getdealerbyid
          curl -sS http://127.0.0.1:8000/djangoapp/api/dealers/1/ >> ../getdealerbyid 2>&1
          printf '$ curl -sS "http://127.0.0.1:8000/djangoapp/api/dealers/?state=Kansas"\n' > ../getdealersbyState
          curl -sS 'http://127.0.0.1:8000/djangoapp/api/dealers/?state=Kansas' >> ../getdealersbyState 2>&1
          printf '$ curl -sS http://127.0.0.1:8000/djangoapp/api/car-makes/\n' > ../getallcarmakes
          curl -sS http://127.0.0.1:8000/djangoapp/api/car-makes/ >> ../getallcarmakes 2>&1
          printf '$ curl -sS -X POST http://127.0.0.1:8000/djangoapp/api/analyze-review/ -H "Content-Type: application/json" -d {"review":"Fantastic services"}\n' > ../analyzereview
          curl -sS -X POST http://127.0.0.1:8000/djangoapp/api/analyze-review/ -H 'Content-Type: application/json' -d '{"review":"Fantastic services"}' >> ../analyzereview 2>&1
          sleep 1
          {
            echo "GitHub Actions workflow: Django and frontend CI"
            echo "Workflow run ID: ${GITHUB_RUN_ID}"
            echo "Commit SHA: ${GITHUB_SHA}"
            echo "Steps completed before evidence generation:"
            echo "1. Checkout repository"
            echo "2. Set up Python 3.12"
            echo "3. Install Django dependencies"
            echo "4. Django system check"
            echo "5. Database migrations"
            echo "6. Seed sample dealer and car data"
            echo "7. Django unit tests"
            echo "8. Set up Node.js 22"
            echo "9. Install React dependencies"
            echo "10. Build the React frontend"
            echo "11. Start Django and execute cURL smoke tests"
            echo "Detailed step logs: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > ../CICD
          cat ../django_server
      - name: Capture real local browser screenshots
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
          CI_ADMIN_PASSWORD: ScreenshotRoot123!
        shell: bash
        run: |
          set -euo pipefail
          python manage.py shell -c "from django.contrib.auth.models import User; u, _ = User.objects.get_or_create(username='root'); u.is_staff=True; u.is_superuser=True; u.is_active=True; u.set_password('ScreenshotRoot123!'); u.save()"
          python manage.py runserver 127.0.0.1:8000 > ../django_screenshot_server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot
          cd frontend
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cd ..
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/djangoapp/api/dealers/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/djangoapp/api/dealers/ >/dev/null
          xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/capture_screenshots.mjs
      - name: Upload command-output evidence files
        uses: actions/upload-artifact@v4
        with:
          name: cars-dealership-terminal-evidence
          path: |
            django_server
            loginuser
            logoutuser
            getdealerreviews
            getalldealers
            getdealerbyid
            getdealersbyState
            getallcarmakes
            analyzereview
            CICD
            admin_login.png
            admin_logout.png
            get_dealers.png
            get_dealers_loggedin.png
            dealersbystate.png
            dealer_id_reviews.png
            dealership_review_submission.png
            added_review.png
          if-no-files-found: error
